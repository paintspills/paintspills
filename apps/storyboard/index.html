<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Storyboard Builder</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #0d1117;
      --panel:   #161b22;
      --panel-2: #1c2230;
      --panel-3: #212836;
      --line:    #2d3748;
      --line-2:  #3a4556;
      --text:    #e2e8f0;
      --muted:   #94a3b8;
      --muted-2: #64748b;
      --accent:  #4a90d9;
      --accent-2:#1e3a5a;
      --gold:    #d4a017;
      --gold-2:  #b8891a;
      --danger:  #e5484d;
      --danger-2:#3a1015;
      --shadow:  0 8px 24px rgba(0,0,0,0.4);
      --radius:  14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'DM Sans', ui-sans-serif, system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
      height: 100vh;
      overflow: hidden;
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      border: 1px solid var(--line-2);
      background: var(--panel-2);
      color: var(--muted);
      border-radius: 10px;
      padding: 9px 12px;
      cursor: pointer;
      transition: 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }

    button:hover { background: var(--panel-3); color: var(--text); transform: translateY(-1px); box-shadow: 0 3px 10px rgba(0,0,0,.3); }
    button:active { transform: translateY(0); box-shadow: none; }

    .primary { background: var(--gold); color: #1a1000; border-color: var(--gold-2); font-weight: 700; }
    .primary:hover { background: var(--gold-2); color: #1a1000; }
    .ghost { background: transparent; }
    .danger { color: var(--danger); border-color: var(--danger-2); background: #2a1012; }
    .danger:hover { background: #3a1015; color: var(--danger); }
    .small { padding: 6px 9px; font-size: 12px; border-radius: 8px; }
    .toolbar-icon { width: 36px; height: 36px; padding: 0; }

    .app {
      height: 100vh;
      display: grid;
      grid-template-rows: 64px 1fr 112px;
      grid-template-columns: 260px 1fr 330px;
      grid-template-areas:
        "top top top"
        "side main inspector"
        "timeline timeline timeline";
    }

    header {
      grid-area: top;
      background: rgba(22,27,34,0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 18px;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 250px;
    }

    .logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--gold), var(--accent));
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      box-shadow: 0 8px 16px rgba(212,160,23,.25);
    }

    .brand-title { font-weight: 800; font-size: 19px; font-family: 'Syne', sans-serif; letter-spacing: -0.3px; }

    .project-title {
      border: 1px solid transparent;
      background: transparent;
      border-radius: 8px;
      padding: 6px 8px;
      font-weight: 700;
      max-width: 230px;
      color: var(--text);
    }
    .project-title:focus { border-color: var(--line-2); outline: none; background: var(--panel-2); }

    .top-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .spacer { flex: 1; }

    .search {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 250px;
      max-width: 360px;
      flex: 1;
      background: var(--panel-2);
      border: 1px solid var(--line-2);
      border-radius: 12px;
      padding: 0 10px;
      height: 38px;
    }
    .search input { border: none; outline: none; background: transparent; width: 100%; color: var(--text); }

    aside.sidebar {
      grid-area: side;
      background: var(--panel);
      border-right: 1px solid var(--line);
      overflow: auto;
      padding: 16px;
    }

    .side-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .side-title { font-weight: 800; }
    .side-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }

    .scene {
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 12px;
      background: var(--panel-2);
    }

    .scene-head {
      padding: 10px 12px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--panel-3);
      border-bottom: 1px solid var(--line);
    }

    .shot-list { list-style: none; padding: 6px; margin: 0; }
    .shot-list li {
      padding: 8px 8px;
      border-radius: 8px;
      font-size: 13px;
      display: flex;
      gap: 8px;
      align-items: center;
      cursor: pointer;
      color: var(--muted);
    }
    .shot-list li:hover { background: var(--panel-2); color: var(--text); }
    .shot-list li.active { background: var(--accent-2); color: var(--accent); font-weight: 700; }
    .shot-code { min-width: 28px; font-weight: 800; }

    main {
      grid-area: main;
      overflow: auto;
      padding: 16px 18px 24px;
    }

    .main-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      position: sticky;
      top: -16px;
      background: rgba(13,17,23,0.95);
      backdrop-filter: blur(10px);
      padding: 14px 0 12px;
      z-index: 5;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 14px;
      padding-bottom: 20px;
    }

    .card {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.3);
      cursor: pointer;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 9px;
      min-height: 330px;
    }
    .card.active { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212,160,23,.18); }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 800;
    }

    .shot-thumb {
      height: 140px;
      background: var(--panel-3);
      border: 1px dashed var(--line-2);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      display: grid;
      place-items: center;
    }

    .shot-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb-placeholder { color: var(--muted); font-size: 13px; text-align: center; padding: 12px; }
    .thumb-tools {
      position: absolute;
      right: 6px;
      bottom: 6px;
      display: flex;
      gap: 5px;
    }
    .thumb-tools button { font-size: 11px; padding: 5px 7px; background: rgba(22,27,34,.9); color: var(--text); }

    .card h3 { margin: 0; font-size: 15px; }
    .card p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.35; min-height: 36px; }
    .meta-row { display: grid; grid-template-columns: 1fr 1fr 70px; gap: 6px; margin-top: auto; }
    .meta { font-size: 11px; color: var(--muted); }
    .meta strong { display:block; color:var(--text); font-size:12px; font-weight:700; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .drag-handle {
      position: absolute;
      left: 4px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted-2);
      font-size: 20px;
      cursor: grab;
      user-select: none;
    }

    .inspector {
      grid-area: inspector;
      background: var(--panel);
      border-left: 1px solid var(--line);
      overflow: auto;
      padding: 16px;
    }

    .inspector h2 { font-size: 18px; margin: 0 0 12px; color: var(--text); font-family: 'Syne', sans-serif; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12px; color: var(--muted); font-weight: 700; margin-bottom: 5px; letter-spacing: 0.3px; }
    .field input, .field textarea, .field select {
      width: 100%;
      border: 1px solid var(--line-2);
      border-radius: 10px;
      padding: 9px 10px;
      background: var(--panel-3);
      color: var(--text);
      outline: none;
    }
    .field textarea { min-height: 78px; resize: vertical; }
    .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212,160,23,.15); }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 36px;
      border: 1px solid var(--line-2);
      border-radius: 10px;
      padding: 7px;
      background: var(--panel-3);
    }
    .tag {
      background: var(--accent-2);
      color: var(--accent);
      border: 1px solid #1e3a5a;
      font-size: 12px;
      border-radius: 999px;
      padding: 4px 8px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .tag button { border: 0; padding: 0; background: transparent; color: var(--accent); box-shadow: none; transform: none !important; }
    .tag-input { border: none !important; box-shadow: none !important; padding: 3px !important; flex: 1; min-width: 90px; }

    .timeline {
      grid-area: timeline;
      background: rgba(22,27,34,0.97);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: 150px 1fr;
      overflow: hidden;
    }

    .timeline-left {
      padding: 16px;
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .filmstrip {
      overflow-x: auto;
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 14px;
    }

    .mini {
      flex: 0 0 110px;
      height: 78px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel-2);
      padding: 5px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .mini.active { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212,160,23,.2); }
    .mini img { width: 100%; height: 44px; object-fit: cover; border-radius: 6px; background:var(--panel-3); }
    .mini .no-img { height: 44px; border-radius: 6px; background:var(--panel-3); display:grid; place-items:center; color:var(--muted-2); font-size:10px; }
    .mini-label { display:flex; justify-content:space-between; align-items:center; font-size:11px; font-weight:800; margin-top:3px; }

    .empty-state {
      height: 60vh;
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
      border: 2px dashed var(--line-2);
      border-radius: var(--radius);
      background: rgba(28,34,48,.4);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 18px;
    }
    .modal-backdrop.show { display: flex; }
    .modal {
      background: var(--panel);
      border-radius: 18px;
      width: min(880px, 95vw);
      max-height: 90vh;
      overflow: auto;
      box-shadow: var(--shadow);
      padding: 18px;
    }
    .modal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
    canvas { touch-action: none; }
    .draw-canvas-wrap {
      position: relative;
      width: 100%;
    }
    #drawCanvas {
      width: 100%;
      height: 420px;
      border: 1px solid var(--line-2);
      border-radius: 12px;
      background: #fff;
      display: block;
      cursor: none;
    }
    #brushCursor {
      position: absolute;
      left: 0;
      top: 0;
      width: 10px;
      height: 10px;
      border: 2px solid rgba(35, 39, 47, .85);
      border-radius: 999px;
      background: rgba(255,255,255,.18);
      box-shadow: 0 0 0 1px rgba(255,255,255,.95), 0 2px 8px rgba(0,0,0,.18);
      pointer-events: none;
      transform: translate(-50%, -50%);
      display: none;
      z-index: 3;
      mix-blend-mode: multiply;
    }
    #brushCursor.eraser {
      border-style: dashed;
      border-color: rgba(220, 38, 38, .9);
      background: rgba(255,255,255,.4);
    }
    .draw-tools { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
    .draw-tools input[type="range"] { width: 120px; }

    @media print {
      body { overflow: visible; background: #fff; }
      .app { display: block; height: auto; }
      header, .sidebar, .inspector, .timeline, .main-toolbar { display: none !important; }
      main { overflow: visible; padding: 0; }
      .grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
      .card { break-inside: avoid; box-shadow: none; min-height: 280px; }
      .thumb-tools, .drag-handle { display: none; }
    }

    @media (max-width: 1050px) {
      .app { grid-template-columns: 210px 1fr; grid-template-areas: "top top" "side main" "timeline timeline"; }
      .inspector { position: fixed; right: 0; top: 64px; bottom: 112px; width: 330px; box-shadow: var(--shadow); z-index: 20; transform: translateX(100%); transition:.2s ease; }
      .inspector.open { transform: translateX(0); }
      .search { display: none; }
    }

    @media (max-width: 760px) {
      body { overflow: auto; }
      .app { height:auto; min-height:100vh; display:block; }
      header { position: sticky; top:0; flex-wrap:wrap; height:auto; min-height:64px; padding:10px; }
      .brand { min-width:auto; }
      .top-actions { overflow-x:auto; width:100%; }
      .sidebar { display:none; }
      main { overflow:visible; padding:12px; }
      .timeline { position: sticky; bottom:0; height:112px; display:block; }
      .timeline-left { display:none; }
      .inspector { display:none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="logo">SB</div>
        <div>
          <div class="brand-title">Storyboard Builder</div>
          <input id="projectTitle" class="project-title" aria-label="Project title" />
        </div>
      </div>
      <div class="top-actions">
        <button id="newProjectBtn" class="primary">＋ New</button>
        <button id="saveBtn">💾 Save Project File</button>
        <button id="importJsonBtn">📂 Load Project File</button>
        <input id="importFile" type="file" accept="application/json,.json,.storyboard" hidden />
        <button id="printBtn">🖨 Print/PDF</button>
        <button id="playBtn">▶ Play Preview</button>
      </div>
      <div class="spacer"></div>
      <div class="search">🔎 <input id="searchInput" placeholder="Search shots, tags, notes..." /></div>
      <a href="../../index.html" style="font-family:'DM Mono',monospace; font-size:10px; color:var(--muted-2); text-decoration:none; letter-spacing:0.5px; white-space:nowrap; margin-left:8px;" onmouseover="this.style.color='#d4a017'" onmouseout="this.style.color='var(--muted-2)'">← Hub</a>
    </header>

    <aside class="sidebar">
      <div class="side-header">
        <div>
          <div class="side-title">Scenes</div>
          <div id="shotCount" class="side-sub">0 shots</div>
        </div>
        <button id="addSceneBtn" class="small">＋ Scene</button>
      </div>
      <div id="sceneList"></div>
    </aside>

    <main>
      <div class="main-toolbar">
        <button id="addPanelBtn" class="primary">＋ Add Panel</button>
        <button id="duplicateBtn">⧉ Duplicate</button>
        <button id="deleteBtn" class="danger">Delete</button>
        <button id="moveLeftBtn">← Move</button>
        <button id="moveRightBtn">Move →</button>
        <button id="addTransitionBtn">＋ Transition Note</button>
        <div class="spacer"></div>
        <button id="gridBtn" class="small primary">Grid</button>
      </div>
      <div id="storyGrid" class="grid"></div>
    </main>

    <section id="inspector" class="inspector">
      <h2 id="inspectorTitle">Shot</h2>
      <div class="field">
        <label>Shot Title</label>
        <input id="shotTitle" />
      </div>
      <div class="field">
        <label>Description / Action</label>
        <textarea id="shotDescription"></textarea>
      </div>
      <div class="two">
        <div class="field">
          <label>Camera Angle</label>
          <select id="shotAngle">
            <option>Wide Shot</option>
            <option>Medium Shot</option>
            <option>Close Up</option>
            <option>Extreme Close Up</option>
            <option>Over The Shoulder</option>
            <option>Two Shot</option>
            <option>Insert</option>
            <option>Low Angle</option>
            <option>High Angle</option>
            <option>POV</option>
          </select>
        </div>
        <div class="field">
          <label>Duration, seconds</label>
          <input id="shotDuration" type="number" min="0.1" step="0.1" />
        </div>
      </div>
      <div class="field">
        <label>Dialogue / Voiceover</label>
        <textarea id="shotDialogue"></textarea>
      </div>
      <div class="field">
        <label>Notes</label>
        <textarea id="shotNotes"></textarea>
      </div>
      <div class="field">
        <label>Tags — press Enter to add</label>
        <div id="tagBox" class="tags"></div>
      </div>
      <div class="two">
        <div class="field">
          <label>Status</label>
          <select id="shotStatus">
            <option>Planned</option>
            <option>Needs Drawing</option>
            <option>Ready</option>
            <option>Revised</option>
          </select>
        </div>
        <div class="field">
          <label>Scene</label>
          <select id="shotScene"></select>
        </div>
      </div>
      <button id="clearImageBtn" class="danger">Clear Thumbnail</button>
    </section>

    <section class="timeline">
      <div class="timeline-left">
        <button id="timelinePlayBtn" class="primary">▶ Timeline</button>
        <button id="addNoteBtn">＋ Add Note</button>
      </div>
      <div id="filmstrip" class="filmstrip"></div>
    </section>
  </div>

  <div id="drawModal" class="modal-backdrop">
    <div class="modal">
      <div class="modal-head">
        <h2 style="margin:0; font-family:'Syne',sans-serif; color:var(--text)">Draw Thumbnail</h2>
        <button id="closeDrawBtn" class="toolbar-icon">✕</button>
      </div>
      <div class="draw-tools">
        <label>Color <input id="brushColor" type="color" value="#222222"></label>
        <label>Size <input id="brushSize" type="range" min="1" max="28" value="5"></label>
        <button id="eraserBtn">Eraser</button>
        <button id="penBtn" class="primary">Pen</button>
        <button id="clearCanvasBtn">Clear</button>
        <button id="saveDrawingBtn" class="primary">Save Drawing</button>
      </div>
      <div class="draw-canvas-wrap">
        <canvas id="drawCanvas" width="1200" height="675"></canvas>
        <div id="brushCursor" aria-hidden="true"></div>
      </div>
    </div>
  </div>

  <div id="previewModal" class="modal-backdrop">
    <div class="modal" style="max-width:980px">
      <div class="modal-head">
        <h2 style="margin:0; font-family:'Syne',sans-serif; color:var(--text)">Animatic Preview</h2>
        <button id="closePreviewBtn" class="toolbar-icon">✕</button>
      </div>
      <div id="previewStage" style="height:520px; border-radius:14px; background:#111; display:grid; place-items:center; overflow:hidden; position:relative; color:white;"></div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:12px; gap:10px;">
        <div id="previewCaption" style="color:var(--muted)"></div>
        <button id="stopPreviewBtn">Stop</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'singleFileStoryboardBuilder.blank.v1';

    const starterProject = () => ({
      title: 'Untitled Storyboard',
      updated: new Date().toISOString(),
      scenes: [
        { id: uid(), title: 'Scene 1' }
      ],
      shots: []
    });

    function uid() { return 'id-' + Math.random().toString(36).slice(2) + '-' + Date.now().toString(36); }

    let project = starterProject();

    function shot(code, sceneId, title, description, angle, duration, tags=[]) {
      return {
        id: uid(), code, sceneId, title, description, angle, duration,
        dialogue: '', notes: '', tags, status: 'Planned', image: '', transition: ''
      };
    }

    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) project = JSON.parse(saved);
    } catch (e) { console.warn('Could not load saved project', e); }

    let selectedId = project.shots[0]?.id || null;
    let searchTerm = '';
    let currentDrawShotId = null;
    let drawing = false;
    let erasing = false;
    let previewTimer = null;

    const els = {
      projectTitle: document.getElementById('projectTitle'),
      shotCount: document.getElementById('shotCount'),
      sceneList: document.getElementById('sceneList'),
      storyGrid: document.getElementById('storyGrid'),
      filmstrip: document.getElementById('filmstrip'),
      inspector: document.getElementById('inspector'),
      inspectorTitle: document.getElementById('inspectorTitle'),
      shotTitle: document.getElementById('shotTitle'),
      shotDescription: document.getElementById('shotDescription'),
      shotAngle: document.getElementById('shotAngle'),
      shotDuration: document.getElementById('shotDuration'),
      shotDialogue: document.getElementById('shotDialogue'),
      shotNotes: document.getElementById('shotNotes'),
      shotStatus: document.getElementById('shotStatus'),
      shotScene: document.getElementById('shotScene'),
      tagBox: document.getElementById('tagBox'),
      drawModal: document.getElementById('drawModal'),
      drawCanvas: document.getElementById('drawCanvas'),
      brushCursor: document.getElementById('brushCursor'),
      previewModal: document.getElementById('previewModal'),
      previewStage: document.getElementById('previewStage'),
      previewCaption: document.getElementById('previewCaption')
    };

    const ctx = els.drawCanvas.getContext('2d');

    function selectedShot() { return project.shots.find(s => s.id === selectedId) || project.shots[0] || null; }
    function sceneTitle(id) { return project.scenes.find(s => s.id === id)?.title || 'Unassigned'; }

    function renumberShots() {
      project.scenes.forEach((scene, sceneIndex) => {
        project.shots.filter(s => s.sceneId === scene.id).forEach((s, idx) => {
          const letter = String.fromCharCode(65 + idx);
          s.code = `${sceneIndex + 1}${letter}`;
        });
      });
    }

    function saveLocal() {
      project.updated = new Date().toISOString();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(project));
    }

    function render() {
      renumberShots();
      els.projectTitle.value = project.title;
      els.shotCount.textContent = `${project.shots.length} shot${project.shots.length === 1 ? '' : 's'}`;
      renderScenes();
      renderGrid();
      renderInspector();
      renderTimeline();
      saveLocal();
    }

    function shotMatches(s) {
      if (!searchTerm) return true;
      const hay = [s.code, s.title, s.description, s.dialogue, s.notes, s.angle, s.status, ...(s.tags || [])].join(' ').toLowerCase();
      return hay.includes(searchTerm.toLowerCase());
    }

    function renderScenes() {
      els.sceneList.innerHTML = '';
      project.scenes.forEach(scene => {
        const shots = project.shots.filter(s => s.sceneId === scene.id);
        const box = document.createElement('div');
        box.className = 'scene';
        box.innerHTML = `
          <div class="scene-head">
            <span contenteditable="true" data-scene-title="${scene.id}">${escapeHtml(scene.title)}</span>
            <span class="side-sub">${shots.length}</span>
          </div>
          <ul class="shot-list"></ul>`;
        const ul = box.querySelector('ul');
        shots.forEach(s => {
          const li = document.createElement('li');
          li.className = s.id === selectedId ? 'active' : '';
          li.innerHTML = `<span class="shot-code">${s.code}</span><span>${escapeHtml(s.title || 'Untitled')}</span>`;
          li.onclick = () => selectShot(s.id);
          ul.appendChild(li);
        });
        els.sceneList.appendChild(box);
      });

      document.querySelectorAll('[data-scene-title]').forEach(node => {
        node.addEventListener('blur', () => {
          const scene = project.scenes.find(s => s.id === node.dataset.sceneTitle);
          if (scene) scene.title = node.textContent.trim() || 'Untitled Scene';
          render();
        });
      });
    }

    function renderGrid() {
      const shots = project.shots.filter(shotMatches);
      els.storyGrid.innerHTML = '';
      if (!shots.length) {
        els.storyGrid.className = '';
        els.storyGrid.innerHTML = '<div class="empty-state"><div><h2>No panels yet</h2><p>Click Add Panel to create your first storyboard shot.</p></div></div>';
        return;
      }
      els.storyGrid.className = 'grid';
      shots.forEach((s) => {
        const card = document.createElement('article');
        card.className = 'card' + (s.id === selectedId ? ' active' : '');
        card.draggable = true;
        card.dataset.id = s.id;
        card.innerHTML = `
          <div class="drag-handle">⋮</div>
          <div class="card-top"><span>${s.code}</span><span>${formatDuration(s.duration)}</span></div>
          <div class="shot-thumb">
            ${s.image ? `<img src="${s.image}" alt="Storyboard thumbnail">` : `<div class="thumb-placeholder">No thumbnail yet<br><small>Upload or draw one</small></div>`}
            <div class="thumb-tools">
              <button data-upload="${s.id}">Upload</button>
              <button data-draw="${s.id}">Draw</button>
            </div>
          </div>
          <h3>${escapeHtml(s.title || 'Untitled Shot')}</h3>
          <p>${escapeHtml(s.description || '')}</p>
          ${s.transition ? `<p style="background:#fff7e6;border:1px solid #ffd999;padding:6px;border-radius:8px"><strong>Transition:</strong> ${escapeHtml(s.transition)}</p>` : ''}
          <div class="meta-row">
            <div class="meta">Angle<strong>${escapeHtml(s.angle || '—')}</strong></div>
            <div class="meta">Dialogue<strong>${escapeHtml(s.dialogue ? 'Yes' : '—')}</strong></div>
            <div class="meta">Status<strong>${escapeHtml(s.status || '—')}</strong></div>
          </div>
        `;
        card.onclick = (e) => {
          if (e.target.closest('button')) return;
          selectShot(s.id);
        };
        card.addEventListener('dragstart', onDragStart);
        card.addEventListener('dragover', onDragOver);
        card.addEventListener('drop', onDrop);
        els.storyGrid.appendChild(card);
      });

      document.querySelectorAll('[data-upload]').forEach(btn => btn.onclick = () => uploadImage(btn.dataset.upload));
      document.querySelectorAll('[data-draw]').forEach(btn => btn.onclick = () => openDraw(btn.dataset.draw));
    }

    function renderTimeline() {
      els.filmstrip.innerHTML = '';
      project.shots.forEach(s => {
        const mini = document.createElement('div');
        mini.className = 'mini' + (s.id === selectedId ? ' active' : '');
        mini.innerHTML = `${s.image ? `<img src="${s.image}">` : `<div class="no-img">No Image</div>`}<div class="mini-label"><span>${s.code}</span><span>${formatDuration(s.duration)}</span></div>`;
        mini.onclick = () => selectShot(s.id);
        els.filmstrip.appendChild(mini);
      });
      const add = document.createElement('button');
      add.textContent = '＋ Add Panel';
      add.onclick = addPanel;
      els.filmstrip.appendChild(add);
    }

    function renderInspector() {
      const s = selectedShot();
      els.shotScene.innerHTML = project.scenes.map(scene => `<option value="${scene.id}">${escapeHtml(scene.title)}</option>`).join('');
      if (!s) {
        els.inspectorTitle.textContent = 'No Shot Selected';
        ['shotTitle','shotDescription','shotDuration','shotDialogue','shotNotes'].forEach(k => els[k].value = '');
        return;
      }
      selectedId = s.id;
      els.inspectorTitle.textContent = `Shot ${s.code}`;
      els.shotTitle.value = s.title || '';
      els.shotDescription.value = s.description || '';
      els.shotAngle.value = s.angle || 'Wide Shot';
      els.shotDuration.value = s.duration || 1;
      els.shotDialogue.value = s.dialogue || '';
      els.shotNotes.value = s.notes || '';
      els.shotStatus.value = s.status || 'Planned';
      els.shotScene.value = s.sceneId;
      renderTags(s);
    }

    function renderTags(s) {
      els.tagBox.innerHTML = '';
      (s.tags || []).forEach((tag, index) => {
        const pill = document.createElement('span');
        pill.className = 'tag';
        pill.innerHTML = `${escapeHtml(tag)} <button title="Remove tag">×</button>`;
        pill.querySelector('button').onclick = () => { s.tags.splice(index, 1); render(); };
        els.tagBox.appendChild(pill);
      });
      const input = document.createElement('input');
      input.className = 'tag-input';
      input.placeholder = 'Add tag';
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter' && input.value.trim()) {
          e.preventDefault();
          s.tags = s.tags || [];
          s.tags.push(input.value.trim());
          render();
        }
      });
      els.tagBox.appendChild(input);
    }

    function bindInspectorField(el, key, parser = v => v) {
      el.addEventListener('input', () => {
        const s = selectedShot();
        if (!s) return;
        s[key] = parser(el.value);
        renderGrid();
        renderTimeline();
        saveLocal();
      });
      el.addEventListener('change', () => {
        const s = selectedShot();
        if (!s) return;
        s[key] = parser(el.value);
        render();
      });
    }

    bindInspectorField(els.shotTitle, 'title');
    bindInspectorField(els.shotDescription, 'description');
    bindInspectorField(els.shotAngle, 'angle');
    bindInspectorField(els.shotDuration, 'duration', v => Math.max(0.1, Number(v) || 1));
    bindInspectorField(els.shotDialogue, 'dialogue');
    bindInspectorField(els.shotNotes, 'notes');
    bindInspectorField(els.shotStatus, 'status');
    els.shotScene.addEventListener('change', () => {
      const s = selectedShot();
      if (!s) return;
      s.sceneId = els.shotScene.value;
      render();
    });

    els.projectTitle.addEventListener('input', () => { project.title = els.projectTitle.value; saveLocal(); });
    document.getElementById('searchInput').addEventListener('input', e => { searchTerm = e.target.value; renderGrid(); });

    function selectShot(id) {
      selectedId = id;
      render();
      els.inspector.classList.add('open');
    }

    function addScene() {
      project.scenes.push({ id: uid(), title: `Scene ${project.scenes.length + 1}` });
      render();
    }

    function addPanel() {
      let sceneId = selectedShot()?.sceneId || project.scenes[0]?.id;
      if (!sceneId) {
        const scene = { id: uid(), title: 'Scene 1' };
        project.scenes.push(scene);
        sceneId = scene.id;
      }
      const s = shot('?', sceneId, 'New Shot', '', 'Wide Shot', 3, []);
      const currentIndex = project.shots.findIndex(x => x.id === selectedId);
      if (currentIndex >= 0) project.shots.splice(currentIndex + 1, 0, s);
      else project.shots.push(s);
      selectedId = s.id;
      render();
    }

    function duplicatePanel() {
      const s = selectedShot();
      if (!s) return;
      const copy = JSON.parse(JSON.stringify(s));
      copy.id = uid();
      copy.title = s.title + ' Copy';
      const index = project.shots.findIndex(x => x.id === s.id);
      project.shots.splice(index + 1, 0, copy);
      selectedId = copy.id;
      render();
    }

    function deletePanel() {
      const s = selectedShot();
      if (!s) return;
      if (!confirm(`Delete ${s.code} — ${s.title}?`)) return;
      const index = project.shots.findIndex(x => x.id === s.id);
      project.shots.splice(index, 1);
      selectedId = project.shots[Math.min(index, project.shots.length - 1)]?.id || null;
      render();
    }

    function moveSelected(delta) {
      const index = project.shots.findIndex(s => s.id === selectedId);
      if (index < 0) return;
      const next = index + delta;
      if (next < 0 || next >= project.shots.length) return;
      [project.shots[index], project.shots[next]] = [project.shots[next], project.shots[index]];
      render();
    }

    function addTransition() {
      const s = selectedShot();
      if (!s) return;
      const text = prompt('Transition note after this shot:', s.transition || 'Cut to next shot');
      if (text !== null) { s.transition = text.trim(); render(); }
    }

    function uploadImage(id) {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = () => {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          resizeImage(reader.result, 1200, 675, data => {
            const s = project.shots.find(x => x.id === id);
            if (s) s.image = data;
            selectedId = id;
            render();
          });
        };
        reader.readAsDataURL(file);
      };
      input.click();
    }

    function resizeImage(src, maxW, maxH, cb) {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = maxW;
        canvas.height = maxH;
        const c = canvas.getContext('2d');
        c.fillStyle = '#ffffff';
        c.fillRect(0,0,maxW,maxH);
        const scale = Math.min(maxW / img.width, maxH / img.height);
        const w = img.width * scale;
        const h = img.height * scale;
        c.drawImage(img, (maxW-w)/2, (maxH-h)/2, w, h);
        cb(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.src = src;
    }

    function openDraw(id) {
      currentDrawShotId = id;
      selectedId = id;
      ctx.clearRect(0,0,els.drawCanvas.width, els.drawCanvas.height);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0,0,els.drawCanvas.width, els.drawCanvas.height);
      const s = project.shots.find(x => x.id === id);
      if (s?.image) {
        const img = new Image();
        img.onload = () => ctx.drawImage(img, 0, 0, els.drawCanvas.width, els.drawCanvas.height);
        img.src = s.image;
      } else {
        drawStoryboardGuide();
      }
      els.drawModal.classList.add('show');
    }

    function drawStoryboardGuide() {
      ctx.save();
      ctx.strokeStyle = '#e6e8ef';
      ctx.lineWidth = 3;
      ctx.strokeRect(28, 28, els.drawCanvas.width - 56, els.drawCanvas.height - 56);
      ctx.beginPath();
      ctx.moveTo(28, els.drawCanvas.height * .66);
      ctx.lineTo(els.drawCanvas.width - 28, els.drawCanvas.height * .66);
      ctx.stroke();
      ctx.fillStyle = '#c3cad8';
      ctx.font = '34px system-ui';
      ctx.fillText('Sketch your storyboard frame here', 56, 86);
      ctx.restore();
    }

    function pointerPos(e) {
      const rect = els.drawCanvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (els.drawCanvas.width / rect.width),
        y: (e.clientY - rect.top) * (els.drawCanvas.height / rect.height)
      };
    }

    function updateBrushCursor(e) {
      const rect = els.drawCanvas.getBoundingClientRect();
      const size = Number(document.getElementById('brushSize').value || 1);
      const scale = rect.width / els.drawCanvas.width;
      const displaySize = Math.max(2, size * scale);
      els.brushCursor.style.width = displaySize + 'px';
      els.brushCursor.style.height = displaySize + 'px';
      els.brushCursor.style.left = (e.clientX - rect.left) + 'px';
      els.brushCursor.style.top = (e.clientY - rect.top) + 'px';
      els.brushCursor.classList.toggle('eraser', erasing);
    }

    els.drawCanvas.addEventListener('pointerenter', e => {
      els.brushCursor.style.display = 'block';
      updateBrushCursor(e);
    });
    els.drawCanvas.addEventListener('pointerleave', () => {
      els.brushCursor.style.display = 'none';
    });

    els.drawCanvas.addEventListener('pointerdown', e => {
      drawing = true;
      els.drawCanvas.setPointerCapture?.(e.pointerId);
      updateBrushCursor(e);
      const p = pointerPos(e);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
    });
    els.drawCanvas.addEventListener('pointermove', e => {
      updateBrushCursor(e);
      if (!drawing) return;
      const p = pointerPos(e);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = document.getElementById('brushSize').value;
      ctx.strokeStyle = erasing ? '#ffffff' : document.getElementById('brushColor').value;
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    });
    window.addEventListener('pointerup', () => drawing = false);

    function syncCursorMode() {
      els.brushCursor.classList.toggle('eraser', erasing);
    }
    document.getElementById('brushSize').addEventListener('input', () => {
      const rect = els.drawCanvas.getBoundingClientRect();
      const size = Number(document.getElementById('brushSize').value || 1);
      const scale = rect.width / els.drawCanvas.width;
      const displaySize = Math.max(2, size * scale);
      els.brushCursor.style.width = displaySize + 'px';
      els.brushCursor.style.height = displaySize + 'px';
    });
    document.getElementById('eraserBtn').onclick = () => { erasing = true; document.getElementById('penBtn').classList.remove('primary'); document.getElementById('eraserBtn').classList.add('primary'); syncCursorMode(); };
    document.getElementById('penBtn').onclick = () => { erasing = false; document.getElementById('eraserBtn').classList.remove('primary'); document.getElementById('penBtn').classList.add('primary'); syncCursorMode(); };
    document.getElementById('clearCanvasBtn').onclick = () => { ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,els.drawCanvas.width,els.drawCanvas.height); drawStoryboardGuide(); };
    document.getElementById('closeDrawBtn').onclick = () => { els.brushCursor.style.display = 'none'; els.drawModal.classList.remove('show'); };
    document.getElementById('saveDrawingBtn').onclick = () => {
      const s = project.shots.find(x => x.id === currentDrawShotId);
      if (s) s.image = els.drawCanvas.toDataURL('image/jpeg', 0.88);
      els.brushCursor.style.display = 'none';
      els.drawModal.classList.remove('show');
      render();
    };

    function exportJson() {
      const blob = new Blob([JSON.stringify(project, null, 2)], {type: 'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = slug(project.title || 'storyboard') + '.storyboard.json';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }

    function importJson(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (!Array.isArray(data.scenes) || !Array.isArray(data.shots)) throw new Error('Invalid storyboard file');
          project = data;
          selectedId = project.shots[0]?.id || null;
          render();
        } catch (e) { alert('Could not import that project file.'); }
      };
      reader.readAsText(file);
    }

    function newProject() {
      if (!confirm('Start a new project? Use Save Project File first if you want a backup of your current storyboard.')) return;
      project = starterProject();
      selectedId = null;
      render();
    }

    function printPdf() {
      document.title = project.title || 'Storyboard';
      window.print();
    }

    function playPreview() {
      const shots = project.shots;
      if (!shots.length) return;
      els.previewModal.classList.add('show');
      let i = 0;
      const show = () => {
        const s = shots[i];
        els.previewStage.innerHTML = s.image
          ? `<img src="${s.image}" style="width:100%;height:100%;object-fit:contain">`
          : `<div style="text-align:center"><h2>${escapeHtml(s.code)} — ${escapeHtml(s.title)}</h2><p>${escapeHtml(s.description || '')}</p></div>`;
        els.previewCaption.textContent = `${s.code} — ${s.title} • ${formatDuration(s.duration)} • ${s.angle}`;
        clearTimeout(previewTimer);
        previewTimer = setTimeout(() => {
          i++;
          if (i >= shots.length) { clearTimeout(previewTimer); return; }
          show();
        }, Math.max(100, Number(s.duration || 1) * 1000));
      };
      show();
    }

    function stopPreview() {
      clearTimeout(previewTimer);
      els.previewModal.classList.remove('show');
    }

    let draggedId = null;
    function onDragStart(e) { draggedId = e.currentTarget.dataset.id; }
    function onDragOver(e) { e.preventDefault(); }
    function onDrop(e) {
      e.preventDefault();
      const targetId = e.currentTarget.dataset.id;
      if (!draggedId || draggedId === targetId) return;
      const from = project.shots.findIndex(s => s.id === draggedId);
      const to = project.shots.findIndex(s => s.id === targetId);
      const [item] = project.shots.splice(from, 1);
      project.shots.splice(to, 0, item);
      draggedId = null;
      render();
    }

    function formatDuration(n) { return `${Number(n || 0).toFixed(Number(n) % 1 ? 1 : 0)}s`; }
    function escapeHtml(str) { return String(str || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
    function slug(str) { return String(str).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'storyboard'; }

    document.getElementById('newProjectBtn').onclick = newProject;
    document.getElementById('saveBtn').onclick = exportJson;
    document.getElementById('importJsonBtn').onclick = () => document.getElementById('importFile').click();
    document.getElementById('importFile').onchange = e => e.target.files[0] && importJson(e.target.files[0]);
    document.getElementById('printBtn').onclick = printPdf;
    document.getElementById('playBtn').onclick = playPreview;
    document.getElementById('timelinePlayBtn').onclick = playPreview;
    document.getElementById('closePreviewBtn').onclick = stopPreview;
    document.getElementById('stopPreviewBtn').onclick = stopPreview;
    document.getElementById('addSceneBtn').onclick = addScene;
    document.getElementById('addPanelBtn').onclick = addPanel;
    document.getElementById('duplicateBtn').onclick = duplicatePanel;
    document.getElementById('deleteBtn').onclick = deletePanel;
    document.getElementById('moveLeftBtn').onclick = () => moveSelected(-1);
    document.getElementById('moveRightBtn').onclick = () => moveSelected(1);
    document.getElementById('addTransitionBtn').onclick = addTransition;
    document.getElementById('addNoteBtn').onclick = addTransition;
    document.getElementById('clearImageBtn').onclick = () => { const s = selectedShot(); if (s) { s.image = ''; render(); } };

    render();
  </script>
</body>
</html>
