<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Camera</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:      #0d1117;
            --surface: #161b22;
            --card:    #1c2230;
            --card2:   #212836;
            --border:  #2d3748;
            --border2: #3a4556;
            --accent:  #3ecf8e;
            --accent2: #2db87a;
            --gold:    #d4a017;
            --blue:    #4a90d9;
            --danger:  #e5484d;
            --text:    #e2e8f0;
            --text2:   #94a3b8;
            --text3:   #64748b;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse 70% 50% at 50% -5%, rgba(62,207,142,0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* ── Header ── */
        header {
            position: relative;
            z-index: 10;
            height: 48px;
            padding: 0 20px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            gap: 12px;
        }

        .logo {
            font-family: 'Syne', sans-serif;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text2);
        }
        .logo span { color: var(--accent); }

        #status-msg {
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            color: var(--text3);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 3px 12px;
        }

        .hub-link {
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            color: var(--text3);
            text-decoration: none;
            letter-spacing: 0.5px;
            transition: color 0.15s;
        }
        .hub-link:hover { color: var(--accent); }

        /* ── Main layout ── */
        .main {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* ── Left: live camera view ── */
        .camera-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #080c10;
        }

        .viewport {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #live-video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        .viewport-label {
            position: absolute;
            top: 12px;
            left: 14px;
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            font-weight: 500;
            color: var(--text);
            background: rgba(13,17,23,0.8);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 4px 10px;
            z-index: 5;
            backdrop-filter: blur(4px);
            letter-spacing: 0.5px;
        }

        /* Capture flash overlay */
        .flash {
            position: absolute;
            inset: 0;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 20;
            transition: opacity 0s;
        }
        .flash.active {
            opacity: 0.85;
            transition: opacity 0.05s;
        }

        /* ── Capture toolbar ── */
        .capture-bar {
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .btn {
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            font-family: 'DM Sans', sans-serif;
            transition: 0.12s;
            letter-spacing: 0.2px;
            white-space: nowrap;
        }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.4; cursor: default; }

        .btn-start {
            background: var(--blue);
            color: white;
            border: 2px solid #3a7cc4;
        }
        .btn-start:hover:not(:disabled) { background: #3a7cc4; }

        .btn-capture {
            background: var(--accent);
            color: #0a1a12;
            border: 2px solid var(--accent2);
            font-size: 14px;
            padding: 10px 32px;
        }
        .btn-capture:hover:not(:disabled) { background: var(--accent2); }

        .cam-select-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .cam-label {
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            color: var(--text3);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        select {
            background: var(--card2);
            border: 1px solid var(--border2);
            color: var(--text);
            padding: 6px 9px;
            font-size: 12px;
            border-radius: 8px;
            font-family: 'DM Sans', sans-serif;
            min-width: 160px;
        }
        select:focus { outline: 1px solid var(--accent); }

        kbd {
            background: var(--bg);
            color: var(--text3);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            border: 1px solid var(--border2);
        }

        /* ── Right: photo roll ── */
        .roll-col {
            width: 220px;
            background: var(--surface);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .roll-header {
            padding: 10px 12px 8px;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .roll-title {
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            letter-spacing: 1.5px;
            color: var(--text3);
            text-transform: uppercase;
        }

        .roll-count {
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            color: var(--accent);
            font-weight: 500;
        }

        .roll-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .roll-list::-webkit-scrollbar { width: 4px; }
        .roll-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

        .roll-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 8px;
            color: var(--text3);
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.5px;
            text-align: center;
            padding: 20px;
            line-height: 1.7;
        }

        .roll-empty-icon { font-size: 28px; opacity: 0.3; }

        /* Individual photo card */
        .photo-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            animation: slideIn 0.25s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .photo-thumb {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            display: block;
            cursor: pointer;
            transition: filter 0.15s;
        }
        .photo-thumb:hover { filter: brightness(1.1); }

        .photo-meta {
            padding: 6px 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
        }

        .photo-name {
            font-family: 'DM Mono', monospace;
            font-size: 9px;
            color: var(--text3);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .dl-btn {
            padding: 3px 8px;
            background: var(--accent);
            color: #0a1a12;
            border: none;
            border-radius: 5px;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            white-space: nowrap;
            transition: background 0.12s;
            flex-shrink: 0;
        }
        .dl-btn:hover { background: var(--accent2); }

        /* Roll footer */
        .roll-footer {
            padding: 8px;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        .btn-dl-all {
            width: 100%;
            padding: 8px;
            background: var(--card2);
            border: 1px solid var(--border2);
            color: var(--text2);
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            transition: 0.12s;
        }
        .btn-dl-all:hover:not(:disabled) { background: var(--card); color: var(--text); border-color: var(--accent); }
        .btn-dl-all:disabled { opacity: 0.35; cursor: default; }

        /* ── Lightbox ── */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.88);
            z-index: 100;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(6px);
        }
        .lightbox.open { display: flex; }

        .lightbox-img {
            max-width: 90vw;
            max-height: 88vh;
            object-fit: contain;
            border-radius: 10px;
            box-shadow: 0 24px 80px rgba(0,0,0,0.7);
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 24px;
            background: var(--card);
            border: 1px solid var(--border2);
            color: var(--text2);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.12s;
        }
        .lightbox-close:hover { background: var(--card2); color: var(--text); }

        .lightbox-dl {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 28px;
            background: var(--accent);
            color: #0a1a12;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            transition: background 0.12s;
        }
        .lightbox-dl:hover { background: var(--accent2); }

        /* ── Student name field ── */
        .name-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .name-input {
            background: var(--card2);
            border: 1px solid var(--border2);
            color: var(--text);
            padding: 7px 10px;
            font-size: 12px;
            border-radius: 8px;
            font-family: 'DM Sans', sans-serif;
            width: 160px;
        }
        .name-input:focus { outline: 1px solid var(--accent); }
        .name-input::placeholder { color: var(--text3); }
    </style>
</head>
<body>

<header>
    <div class="logo">FALCON <span>PORTFOLIO</span> CAMERA</div>
    <div id="status-msg">Initializing…</div>
    <a class="hub-link" href="../../index.html">← Hub</a>
</header>

<div class="main">

    <!-- ── Camera view ── -->
    <div class="camera-col">
        <div class="viewport">
            <div class="viewport-label" id="viewport-label">Camera Stage</div>
            <video id="live-video" autoplay playsinline muted></video>
            <div class="flash" id="flash"></div>
        </div>

        <div class="capture-bar">
            <div class="cam-select-wrap">
                <span class="cam-label">CAMERA</span>
                <select id="cam-select" onchange="switchCamera(this.value)">
                    <option>—</option>
                </select>
            </div>

            <button class="btn btn-start" id="btn-start" onclick="startCamera()">Start Camera</button>

            <div style="width:1px; height:28px; background:var(--border2);"></div>

            <div class="name-row">
                <span class="cam-label">STUDENT</span>
                <input class="name-input" id="student-name" type="text" placeholder="Student name…" maxlength="40">
            </div>

            <div style="width:1px; height:28px; background:var(--border2);"></div>

            <button class="btn btn-capture" id="btn-capture" onclick="capturePhoto()" disabled>
                ⏺ CAPTURE &nbsp;<kbd>SPACE</kbd>
            </button>
        </div>
    </div>

    <!-- ── Photo roll ── -->
    <div class="roll-col">
        <div class="roll-header">
            <span class="roll-title">Photo Roll</span>
            <span class="roll-count" id="roll-count">0</span>
        </div>

        <div class="roll-list" id="roll-list">
            <div class="roll-empty" id="roll-empty">
                <div class="roll-empty-icon">📷</div>
                Start camera then press<br>CAPTURE or SPACE<br>to take a photo.
            </div>
        </div>

        <div class="roll-footer">
            <button class="btn-dl-all" id="btn-dl-all" onclick="downloadAll()" disabled>
                ↓ Download All
            </button>
        </div>
    </div>

</div>

<!-- ── Lightbox ── -->
<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
    <button class="lightbox-close" onclick="closeLightbox()">✕</button>
    <img class="lightbox-img" id="lightbox-img" src="" alt="">
    <button class="lightbox-dl" id="lightbox-dl-btn" onclick="downloadLightboxPhoto()">↓ Download Photo</button>
</div>

<script>
    const video      = document.getElementById('live-video');
    const camSelect  = document.getElementById('cam-select');
    const statusMsg  = document.getElementById('status-msg');
    const captureBtn = document.getElementById('btn-capture');
    const rollList   = document.getElementById('roll-list');
    const rollEmpty  = document.getElementById('roll-empty');
    const rollCount  = document.getElementById('roll-count');
    const dlAllBtn   = document.getElementById('btn-dl-all');

    let currentStream    = null;
    let photos           = [];   // { dataURL, filename }
    let lightboxCurrent  = null;
    let photoCounter     = 0;

    // ── Camera init ──
    async function init() {
        try {
            const initialStream = await navigator.mediaDevices.getUserMedia({
                video: { width: { ideal: 9999 }, height: { ideal: 9999 } }
            });

            const devices = await navigator.mediaDevices.enumerateDevices();
            const vDevs   = devices.filter(d => d.kind === 'videoinput');

            camSelect.innerHTML = '';
            vDevs.forEach((d, i) => {
                const opt = document.createElement('option');
                opt.value = d.deviceId;
                opt.text  = d.label || `Camera ${i + 1}`;
                camSelect.appendChild(opt);
            });

            if (vDevs.length === 0) {
                initialStream.getTracks().forEach(t => t.stop());
                statusMsg.textContent = 'No cameras found.';
                return;
            }

            const activeDeviceId = initialStream.getVideoTracks()[0].getSettings().deviceId;
            if (activeDeviceId) camSelect.value = activeDeviceId;

            if (currentStream) currentStream.getTracks().forEach(t => t.stop());
            currentStream   = initialStream;
            video.srcObject = currentStream;

            video.onloadedmetadata = () => {
                statusMsg.textContent = `Camera ready — ${video.videoWidth}×${video.videoHeight}`;
                document.getElementById('viewport-label').textContent = 'Live';
                captureBtn.disabled = false;
            };

        } catch (err) {
            console.error('Camera init error:', err);
            if (err.name === 'NotAllowedError') {
                statusMsg.textContent = 'Camera permission denied — allow access and try again.';
            } else if (err.name === 'NotFoundError') {
                statusMsg.textContent = 'No camera found on this device.';
            } else {
                statusMsg.textContent = `Camera error: ${err.message}`;
            }
        }
    }

    function startCamera() {
        const sel = camSelect.value;
        if (sel && sel !== '—') switchCamera(sel);
        else init();
    }

    async function switchCamera(deviceId) {
        if (!deviceId || deviceId === '—') return;
        if (camSelect) camSelect.value = deviceId;
        if (currentStream) currentStream.getTracks().forEach(t => t.stop());
        try {
            const constraints = deviceId
                ? { video: { deviceId: { exact: deviceId }, width: { ideal: 9999 }, height: { ideal: 9999 } } }
                : { video: { width: { ideal: 9999 }, height: { ideal: 9999 } } };

            currentStream   = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = currentStream;
            video.onloadedmetadata = () => {
                statusMsg.textContent = `Camera ready — ${video.videoWidth}×${video.videoHeight}`;
                captureBtn.disabled = false;
            };
        } catch (err) {
            console.error('switchCamera error:', err);
            statusMsg.textContent = `Could not switch camera: ${err.message}`;
        }
    }

    // ── Capture ──
    function capturePhoto() {
        if (!currentStream || video.readyState < 2) {
            statusMsg.textContent = 'Camera not ready — start camera first.';
            return;
        }

        // Flash effect
        const flash = document.getElementById('flash');
        flash.classList.add('active');
        setTimeout(() => flash.classList.remove('active'), 150);

        // Draw frame to canvas
        const canvas = document.createElement('canvas');
        canvas.width  = video.videoWidth  || 1920;
        canvas.height = video.videoHeight || 1080;
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);

        const dataURL = canvas.toDataURL('image/jpeg', 0.95);
        photoCounter++;

        const studentName = document.getElementById('student-name').value.trim();
        const namePart    = studentName
            ? studentName.replace(/\s+/g, '_').replace(/[^a-zA-Z0-9_-]/g, '')
            : 'photo';
        const filename = `${namePart}_${String(photoCounter).padStart(3,'0')}.jpg`;

        photos.push({ dataURL, filename });
        addPhotoToRoll(dataURL, filename);

        statusMsg.textContent = `Captured: ${filename} — preview open, click Save to download.`;
        rollCount.textContent = photos.length;
        dlAllBtn.disabled     = false;

        // Open lightbox for preview — student clicks Save to download
        openLightbox(dataURL, filename);
    }

    function download(dataURL, filename) {
        const a = document.createElement('a');
        a.href     = dataURL;
        a.download = filename;
        a.click();
    }

    // ── Roll ──
    function addPhotoToRoll(dataURL, filename) {
        if (rollEmpty && rollEmpty.parentNode) rollEmpty.remove();

        const card = document.createElement('div');
        card.className = 'photo-card';

        const img = document.createElement('img');
        img.className = 'photo-thumb';
        img.src       = dataURL;
        img.alt       = filename;
        img.title     = 'Click to preview';
        img.addEventListener('click', () => openLightbox(dataURL, filename));

        const meta = document.createElement('div');
        meta.className = 'photo-meta';

        const name = document.createElement('span');
        name.className   = 'photo-name';
        name.textContent = filename;

        const btn = document.createElement('button');
        btn.className   = 'dl-btn';
        btn.textContent = '↓';
        btn.title       = 'Download';
        btn.addEventListener('click', () => download(dataURL, filename));

        meta.appendChild(name);
        meta.appendChild(btn);
        card.appendChild(img);
        card.appendChild(meta);

        // Prepend so newest is on top
        rollList.insertBefore(card, rollList.firstChild);
    }

    // ── Download all ──
    function downloadAll() {
        if (!photos.length) return;
        photos.forEach((p, i) => {
            setTimeout(() => download(p.dataURL, p.filename), i * 300);
        });
        statusMsg.textContent = `Downloading ${photos.length} photo${photos.length !== 1 ? 's' : ''}…`;
    }

    // ── Lightbox ──
    function openLightbox(dataURL, filename) {
        document.getElementById('lightbox-img').src = dataURL;
        lightboxCurrent = { dataURL, filename };
        document.getElementById('lightbox').classList.add('open');
    }

    function closeLightbox(e) {
        if (e && e.target !== document.getElementById('lightbox')) return;
        document.getElementById('lightbox').classList.remove('open');
        lightboxCurrent = null;
    }

    function downloadLightboxPhoto() {
        if (lightboxCurrent) download(lightboxCurrent.dataURL, lightboxCurrent.filename);
    }

    // ── Keyboard shortcuts ──
    window.addEventListener('keydown', e => {
        if (e.target.tagName === 'INPUT') return;
        if (e.code === 'Space')  { e.preventDefault(); capturePhoto(); }
        if (e.code === 'Escape') { document.getElementById('lightbox').classList.remove('open'); }
    });

    // ── Boot ──
    init();
</script>
</body>
</html>
