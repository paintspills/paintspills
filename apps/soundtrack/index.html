<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Soundtrack Builder — Paintspills</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { height: 100%; width: 100%; overflow: hidden; }
  body { background: #080810; color: #ddd; font-family: 'Courier New', monospace; font-size: 13px; }

  input[type=text], input[type=number], select, textarea {
    background: #0d0d1a; border: 1px solid #2a2a3a; border-radius: 5px;
    color: #ccc; font-family: inherit; font-size: 12px;
    padding: 5px 8px; width: 100%;
  }
  input[type=range] { width: 100%; accent-color: #7c3aed; }
  input[type=checkbox] { accent-color: #7c3aed; }

  button { font-family: inherit; cursor: pointer; }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #0d0d1a; }
  ::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 3px; }

  .btn {
    padding: 6px 12px; background: #1e1e2e; border: 1px solid #3a3a5a;
    border-radius: 6px; color: #ccc; cursor: pointer; font-size: 13px;
    font-family: inherit; display: inline-flex; align-items: center; gap: 4px;
  }
  .btn:hover { background: #2a2a3e; }
  .btn-green { border-color: #059669; color: #34d399; }
  .btn-green:hover { background: #0a2a1e; }
  .btn-red { border-color: #7f1d1d; color: #fca5a5; }
  .btn-red:hover { background: #2a0a0a; }
  .btn-amber { border-color: #f59e0b; color: #fcd34d; }
  .btn-amber:hover { background: #2a1a00; }
  .btn-purple { border-color: #7c3aed; color: #a78bfa; }

  .mini-btn {
    padding: 3px 8px; background: #1e1e2e; border: 1px solid #2a2a3a;
    border-radius: 4px; cursor: pointer; font-size: 10px; font-weight: 600;
    color: #ccc; font-family: inherit;
  }
  .mini-btn:hover { background: #2a2a3e; }

  .track-btn {
    padding: 2px 5px; border: 1px solid #2a2a3a; border-radius: 3px;
    cursor: pointer; font-size: 9px; font-weight: 700; font-family: inherit;
  }

  .label-row { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: #888; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── Constants ────────────────────────────────────────────────────────────────

const TRACK_DEFS = [
  { id: "music",    label: "Music",    color: "#818cf8" },
  { id: "sfx",      label: "SFX",      color: "#22d3ee" },
  { id: "voice",    label: "Voice",    color: "#fb923c" },
  { id: "ambience", label: "Ambience", color: "#4ade80" },
];

const SAMPLE_LIBRARY = [
  { id:"s1",  name:"Upbeat Loop",    category:"Music loops",     duration:4.0 },
  { id:"s2",  name:"Chill Jazz",     category:"Music loops",     duration:6.0 },
  { id:"s3",  name:"Boing!",         category:"Cartoon effects", duration:0.5 },
  { id:"s4",  name:"Whistle",        category:"Cartoon effects", duration:0.8 },
  { id:"s5",  name:"Punch",          category:"Impacts",         duration:0.4 },
  { id:"s6",  name:"Boom",           category:"Impacts",         duration:0.9 },
  { id:"s7",  name:"Whoosh Fast",    category:"Whooshes",        duration:0.6 },
  { id:"s8",  name:"Swoosh",         category:"Whooshes",        duration:0.7 },
  { id:"s9",  name:"Splat",          category:"Splat/Squish",    duration:0.5 },
  { id:"s10", name:"Squish",         category:"Splat/Squish",    duration:0.4 },
  { id:"s11", name:"Forest",         category:"Ambience",        duration:8.0 },
  { id:"s12", name:"City Noise",     category:"Ambience",        duration:8.0 },
];

const CATEGORIES = ["All","Music loops","Cartoon effects","Impacts","Whooshes","Splat/Squish","Ambience"];
const FPS_OPTIONS = [12, 24, 30];
const TRACK_HEIGHT = 54;

function genId() { return Math.random().toString(36).slice(2, 9); }
function snapToFrame(t, fps) { return Math.round(t * fps) / fps; }

// Beep for previewing / playback (no real audio files)
function createBeep(ctx, freq = 440, dur = 0.3, vol = 0.3) {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
  osc.start(ctx.currentTime);
  osc.stop(ctx.currentTime + dur);
}

function trackFreq(trackId) {
  return { music:330, sfx:660, voice:220, ambience:110 }[trackId] || 440;
}

// ── Audio Engine ──────────────────────────────────────────────────────────────

class AudioEngine {
  constructor() {
    this.ctx = null;
    this.masterGain = null;
    this.trackGains = {};
    this.scheduled = [];
  }
  init() {
    if (this.ctx) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.masterGain = this.ctx.createGain();
    this.masterGain.connect(this.ctx.destination);
    TRACK_DEFS.forEach(t => {
      const g = this.ctx.createGain();
      g.connect(this.masterGain);
      this.trackGains[t.id] = g;
    });
  }
  resume() { if (this.ctx && this.ctx.state === "suspended") this.ctx.resume(); }
  setMasterVol(v) { if (this.masterGain) this.masterGain.gain.value = v; }
  setTrackVol(id, v) { if (this.trackGains[id]) this.trackGains[id].gain.value = v; }

  scheduleClip(clip, offsetSecs) {
    if (!this.ctx) return;
    const dest = this.trackGains[clip.track] || this.masterGain;
    const osc  = this.ctx.createOscillator();
    const env  = this.ctx.createGain();
    osc.connect(env); env.connect(dest);
    osc.frequency.value = trackFreq(clip.track);
    osc.type = "sine";
    const when   = this.ctx.currentTime + Math.max(0, offsetSecs);
    const dur    = clip.duration;
    const vol    = clip.volume ?? 1;
    const fadeIn  = clip.fadeIn  ?? 0;
    const fadeOut = clip.fadeOut ?? 0;
    env.gain.setValueAtTime(fadeIn > 0 ? 0.001 : vol, when);
    if (fadeIn > 0)  env.gain.linearRampToValueAtTime(vol,   when + fadeIn);
    if (fadeOut > 0) {
      env.gain.setValueAtTime(vol,   when + dur - fadeOut);
      env.gain.linearRampToValueAtTime(0.001, when + dur);
    } else {
      env.gain.setValueAtTime(vol, when + dur - 0.02);
      env.gain.linearRampToValueAtTime(0.001, when + dur);
    }
    osc.start(when);
    osc.stop(when + dur);
    this.scheduled.push(osc);
  }

  stopAll() {
    this.scheduled.forEach(n => { try { n.stop(); } catch(_){} });
    this.scheduled = [];
  }

  scheduleTimeline(clips, currentTime, muted, solo) {
    this.stopAll();
    if (!this.ctx) return;
    const hasSolo = TRACK_DEFS.some(t => solo[t.id]);
    clips.forEach(clip => {
      const isMuted = muted[clip.track] || (hasSolo && !solo[clip.track]);
      if (isMuted) return;
      const offset = clip.startTime - currentTime;
      if (offset + clip.duration < 0) return;
      this.scheduleClip(clip, offset);
    });
  }

  async exportWAV(clips, duration, masterVol, muted, solo) {
    const sr = 44100;
    const off = new OfflineAudioContext(2, Math.ceil(duration * sr), sr);
    const mg  = off.createGain(); mg.gain.value = masterVol; mg.connect(off.destination);
    const tg  = {};
    TRACK_DEFS.forEach(t => { const g = off.createGain(); g.connect(mg); tg[t.id] = g; });
    const hasSolo = TRACK_DEFS.some(t => solo[t.id]);
    clips.forEach(clip => {
      if (muted[clip.track] || (hasSolo && !solo[clip.track])) return;
      const dest = tg[clip.track] || mg;
      const osc  = off.createOscillator();
      const env  = off.createGain();
      osc.connect(env); env.connect(dest);
      osc.frequency.value = trackFreq(clip.track);
      const when = clip.startTime, dur = clip.duration;
      const vol = clip.volume ?? 1, fi = clip.fadeIn ?? 0, fo = clip.fadeOut ?? 0;
      env.gain.setValueAtTime(fi > 0 ? 0.001 : vol, when);
      if (fi > 0) env.gain.linearRampToValueAtTime(vol, when + fi);
      if (fo > 0) { env.gain.setValueAtTime(vol, when + dur - fo); env.gain.linearRampToValueAtTime(0.001, when + dur); }
      osc.start(when); osc.stop(when + dur);
    });
    const buf = await off.startRendering();
    return bufToWAV(buf);
  }
}

function bufToWAV(buf) {
  const nc = buf.numberOfChannels, sr = buf.sampleRate, len = buf.length;
  const dv = new DataView(new ArrayBuffer(44 + len * nc * 2));
  const ws = (o, s) => { for (let i=0;i<s.length;i++) dv.setUint8(o+i, s.charCodeAt(i)); };
  ws(0,"RIFF"); dv.setUint32(4, 36+len*nc*2, true); ws(8,"WAVE"); ws(12,"fmt ");
  dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,nc,true);
  dv.setUint32(24,sr,true); dv.setUint32(28,sr*nc*2,true);
  dv.setUint16(32,nc*2,true); dv.setUint16(34,16,true); ws(36,"data");
  dv.setUint32(40, len*nc*2, true);
  let o = 44;
  for (let i=0;i<len;i++) for (let c=0;c<nc;c++) {
    const s = Math.max(-1, Math.min(1, buf.getChannelData(c)[i]));
    dv.setInt16(o, s < 0 ? s*0x8000 : s*0x7fff, true); o += 2;
  }
  return dv.buffer;
}

const engine = new AudioEngine();

// ── VideoPreview ──────────────────────────────────────────────────────────────

function VideoPreview({ videoRef, onDuration }) {
  const [hasVideo, setHasVideo] = useState(false);
  function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    videoRef.current.src = URL.createObjectURL(file);
    videoRef.current.load();
    setHasVideo(true);
  }
  return (
    <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
      <div style={{
        width:"100%", aspectRatio:"16/9", background:"#0a0a14",
        borderRadius:8, overflow:"hidden", border:"1px solid #2a2a3a",
        display:"flex", alignItems:"center", justifyContent:"center"
      }}>
        <video
          ref={videoRef}
          style={{ width:"100%", height:"100%", objectFit:"contain", display: hasVideo ? "block" : "none" }}
          onDurationChange={() => onDuration(videoRef.current.duration || 10)}
        />
        {!hasVideo && (
          <div style={{ textAlign:"center", color:"#444" }}>
            <div style={{ fontSize:32, marginBottom:6 }}>🎬</div>
            <div style={{ fontSize:12 }}>Upload a video to begin</div>
          </div>
        )}
      </div>
      <label className="btn" style={{ alignSelf:"flex-start", fontSize:12, cursor:"pointer" }}>
        📂 Upload Video (MP4 / WebM)
        <input type="file" accept="video/mp4,video/webm" style={{ display:"none" }} onChange={handleFile} />
      </label>
    </div>
  );
}

// ── TransportControls ─────────────────────────────────────────────────────────

function TransportControls({ isPlaying, onPlay, onPause, onRestart, currentTime, fps, duration }) {
  const frame = Math.round(currentTime * fps);
  const fmt = t => {
    const m = Math.floor(t/60).toString().padStart(2,"0");
    const s = (t%60).toFixed(2).padStart(5,"0");
    return `${m}:${s}`;
  };
  return (
    <div style={{ display:"flex", alignItems:"center", gap:8, paddingTop:6, flexWrap:"wrap" }}>
      <button className="btn" onClick={onRestart}>⏮</button>
      {isPlaying
        ? <button className="btn btn-purple" onClick={onPause}>⏸ Pause</button>
        : <button className="btn btn-green"  onClick={onPlay}>▶ Play</button>
      }
      <div style={{ marginLeft:6, display:"flex", gap:12, alignItems:"center" }}>
        <span style={{ color:"#e0e0ff", fontFamily:"monospace", fontSize:14 }}>{fmt(currentTime)}</span>
        <span style={{ color:"#666" }}>Frame <span style={{ color:"#a78bfa", fontFamily:"monospace" }}>{frame}</span></span>
        <span style={{ color:"#444" }}>/ {fmt(duration)}</span>
      </div>
    </div>
  );
}

// ── Timeline ──────────────────────────────────────────────────────────────────

function Timeline({ duration, currentTime, zoom, fps, snapEnabled,
    markers, clips, selectedClip, selectedMarker,
    onSeek, onSelectClip, onSelectMarker, onClipMove,
    trackMuted, trackSolo, onToggleMute, onToggleSolo }) {

  const scrollRef = useRef(null);
  const pxPerSec  = zoom;
  const totalW    = Math.max(duration * pxPerSec + 300, 600);

  const toX   = t => t * pxPerSec;
  const fromX = x => x / pxPerSec;

  function clickRuler(e) {
    const rect = scrollRef.current.getBoundingClientRect();
    const x = e.clientX - rect.left + scrollRef.current.scrollLeft;
    onSeek(Math.max(0, Math.min(duration, fromX(x))));
  }

  // Clip dragging
  function startDrag(e, clip) {
    e.stopPropagation();
    const startX    = e.clientX;
    const startTime = clip.startTime;
    function onMove(ev) {
      let t = startTime + (ev.clientX - startX) / pxPerSec;
      if (snapEnabled) t = snapToFrame(t, fps);
      onClipMove(clip.id, Math.max(0, t));
    }
    function onUp() {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup",   onUp);
    }
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup",   onUp);
  }

  // Ruler ticks
  const step = pxPerSec >= 120 ? 0.5 : pxPerSec >= 70 ? 1 : 2;
  const ticks = [];
  for (let t = 0; t <= duration + step; t += step) ticks.push(+(t.toFixed(2)));

  return (
    <div style={{ display:"flex", flex:1, overflow:"hidden", background:"#0d0d1a", borderTop:"1px solid #1e1e3a" }}>

      {/* Track headers */}
      <div style={{ width:114, flexShrink:0, background:"#0a0a18", borderRight:"1px solid #1e1e3a" }}>
        <div style={{ height:26, borderBottom:"1px solid #1e1e3a" }} />
        {TRACK_DEFS.map(td => (
          <div key={td.id} style={{
            height:TRACK_HEIGHT, display:"flex", flexDirection:"column",
            justifyContent:"center", padding:"0 8px", borderBottom:"1px solid #1e1e3a"
          }}>
            <div style={{ fontSize:12, fontWeight:700, color:td.color, marginBottom:4 }}>{td.label}</div>
            <div style={{ display:"flex", gap:4 }}>
              <button className="track-btn"
                onClick={() => onToggleMute(td.id)}
                style={{ background: trackMuted[td.id] ? "#7f1d1d" : "#1e1e2e", color: trackMuted[td.id] ? "#fca5a5" : "#555" }}>
                M
              </button>
              <button className="track-btn"
                onClick={() => onToggleSolo(td.id)}
                style={{ background: trackSolo[td.id] ? "#713f12" : "#1e1e2e", color: trackSolo[td.id] ? "#fcd34d" : "#555" }}>
                S
              </button>
            </div>
          </div>
        ))}
      </div>

      {/* Scrollable area */}
      <div ref={scrollRef} style={{ flex:1, overflowX:"auto", overflowY:"hidden", position:"relative" }}>
        <div style={{ width:totalW, position:"relative", userSelect:"none" }}>

          {/* Ruler */}
          <div onClick={clickRuler} style={{
            height:26, background:"#080812", borderBottom:"1px solid #1e1e3a",
            position:"relative", cursor:"crosshair"
          }}>
            {ticks.map(t => (
              <div key={t} style={{ position:"absolute", left:toX(t), top:0, height:"100%" }}>
                <div style={{ width:1, height: t%1===0 ? 14 : 7, background:"#2a2a4a" }} />
                {t%1===0 && <span style={{ position:"absolute", top:14, left:2, fontSize:9, color:"#555", whiteSpace:"nowrap" }}>{t}s</span>}
              </div>
            ))}
          </div>

          {/* Tracks */}
          {TRACK_DEFS.map((td, ti) => (
            <div key={td.id} onClick={clickRuler} style={{
              height:TRACK_HEIGHT, position:"relative",
              background: ti%2===0 ? "#0f0f1e" : "#0c0c1a",
              borderBottom:"1px solid #1a1a2e", cursor:"crosshair"
            }}>
              {clips.filter(c => c.track === td.id).map(clip => {
                const w = Math.max(6, clip.duration * pxPerSec);
                const sel = selectedClip === clip.id;
                return (
                  <div key={clip.id}
                    onMouseDown={e => startDrag(e, clip)}
                    onClick={e => { e.stopPropagation(); onSelectClip(clip.id); }}
                    style={{
                      position:"absolute", left:toX(clip.startTime), top:7,
                      width:w, height:TRACK_HEIGHT - 14,
                      background: sel ? td.color + "44" : td.color + "22",
                      border:`1.5px solid ${sel ? td.color : td.color + "99"}`,
                      borderRadius:4, cursor:"grab", overflow:"hidden",
                      boxShadow: sel ? `0 0 0 1px ${td.color}` : "none"
                    }}>
                    <div style={{ fontSize:10, color:td.color, padding:"2px 5px", whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis", fontWeight:600 }}>
                      {clip.name}
                    </div>
                    <div style={{ fontSize:9, color:"#666", paddingLeft:5 }}>{clip.duration.toFixed(1)}s</div>
                  </div>
                );
              })}
            </div>
          ))}

          {/* Markers */}
          {markers.map(m => (
            <div key={m.id} onClick={e => { e.stopPropagation(); onSelectMarker(m.id); }}
              style={{
                position:"absolute", left:toX(m.time), top:26, bottom:0,
                width:1, background: selectedMarker===m.id ? "#fbbf24" : "#f59e0b",
                zIndex:5, cursor:"pointer"
              }}>
              <div style={{
                position:"absolute", top:0, left:0, background:"#f59e0b",
                color:"#000", fontSize:9, fontWeight:700, padding:"1px 4px",
                borderRadius:"0 3px 3px 0", whiteSpace:"nowrap", maxWidth:70,
                overflow:"hidden", textOverflow:"ellipsis"
              }}>{m.label || "M"}</div>
            </div>
          ))}

          {/* Playhead */}
          <div style={{
            position:"absolute", left:toX(currentTime), top:0, bottom:0,
            width:2, background:"#ef4444", zIndex:10, pointerEvents:"none"
          }}>
            <div style={{ width:8, height:8, background:"#ef4444", borderRadius:"50%", marginLeft:-3, marginTop:22 }} />
          </div>

        </div>
      </div>
    </div>
  );
}

// ── AudioLibrary ──────────────────────────────────────────────────────────────

function AudioLibrary({ onAddClip, selectedMarker, markers }) {
  const [category, setCategory] = useState("All");
  const [search,   setSearch]   = useState("");
  const [userSounds, setUserSounds] = useState([]);

  const all      = [...SAMPLE_LIBRARY, ...userSounds];
  const filtered = all.filter(s =>
    (category === "All" || s.category === category) &&
    s.name.toLowerCase().includes(search.toLowerCase())
  );

  function preview(s) {
    engine.init(); engine.resume();
    const freq = { "Music loops":330, "Cartoon effects":880, "Impacts":220, "Whooshes":660, "Splat/Squish":440, "Ambience":110 }[s.category] || 440;
    createBeep(engine.ctx, freq, Math.min(s.duration, 0.8), 0.4);
  }

  function add(s) {
    const markerTime = selectedMarker ? (markers.find(m => m.id === selectedMarker)?.time ?? 0) : 0;
    const defaultTrack = s.category === "Music loops" ? "music" : s.category === "Ambience" ? "ambience" : "sfx";
    onAddClip({ id:genId(), name:s.name, soundId:s.id, startTime:markerTime,
      duration:s.duration, track:defaultTrack, volume:1, fadeIn:0, fadeOut:0, markerLink:null });
  }

  function handleUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    setUserSounds(prev => [...prev, {
      id: genId(), name: file.name.replace(/\.[^.]+$/, ""),
      category:"Cartoon effects", duration:2.0
    }]);
  }

  return (
    <div style={{ display:"flex", flexDirection:"column", height:"100%", gap:6 }}>
      <div style={{ fontSize:10, fontWeight:700, color:"#555", textTransform:"uppercase", letterSpacing:1 }}>Sound Library</div>
      <input placeholder="Search..." value={search} onChange={e => setSearch(e.target.value)} />
      <select value={category} onChange={e => setCategory(e.target.value)}>
        {CATEGORIES.map(c => <option key={c}>{c}</option>)}
      </select>
      <label className="btn" style={{ fontSize:11, justifyContent:"center", cursor:"pointer", textAlign:"center" }}>
        📁 Upload Audio
        <input type="file" accept="audio/*" style={{ display:"none" }} onChange={handleUpload} />
      </label>

      {selectedMarker && (
        <div style={{ fontSize:10, padding:"4px 6px", background:"#1a1400", border:"1px solid #f59e0b44", borderRadius:4, color:"#fcd34d" }}>
          ◆ Adding at marker time
        </div>
      )}

      <div style={{ flex:1, overflowY:"auto", display:"flex", flexDirection:"column", gap:4 }}>
        {filtered.map(s => (
          <div key={s.id} style={{ background:"#111122", border:"1px solid #1e1e3a", borderRadius:6, padding:"6px 8px" }}>
            <div style={{ fontSize:11, color:"#ddd", marginBottom:1, fontWeight:600 }}>{s.name}</div>
            <div style={{ fontSize:10, color:"#555", marginBottom:5 }}>{s.category} · {s.duration.toFixed(1)}s</div>
            <div style={{ display:"flex", gap:4 }}>
              <button className="mini-btn" style={{ color:"#60a5fa" }} onClick={() => preview(s)}>▶ Preview</button>
              <button className="mini-btn" style={{ color:"#34d399" }} onClick={() => add(s)}>+ Add</button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── MarkerList ────────────────────────────────────────────────────────────────

function MarkerList({ markers, selectedMarker, onSelect, onDelete }) {
  if (markers.length === 0)
    return <div style={{ color:"#444", fontSize:12, paddingTop:4 }}>No markers yet.<br/>Press M to add one at the playhead.</div>;
  return (
    <div style={{ display:"flex", flexDirection:"column", gap:4, overflowY:"auto" }}>
      {markers.map(m => (
        <div key={m.id} onClick={() => onSelect(m.id)} style={{
          display:"flex", alignItems:"center", gap:6, padding:"5px 8px",
          background: selectedMarker===m.id ? "#1e1a00" : "#111122",
          border:`1px solid ${selectedMarker===m.id ? "#f59e0b" : "#1e1e3a"}`,
          borderRadius:5, cursor:"pointer"
        }}>
          <div style={{ width:7, height:7, borderRadius:"50%", background:"#f59e0b", flexShrink:0 }} />
          <div style={{ flex:1, color:"#ccc", fontSize:12, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{m.label || "Marker"}</div>
          <div style={{ color:"#555", fontSize:10, whiteSpace:"nowrap" }}>{m.time.toFixed(2)}s</div>
          <button className="mini-btn" style={{ color:"#f87171" }}
            onClick={e => { e.stopPropagation(); onDelete(m.id); }}>✕</button>
        </div>
      ))}
    </div>
  );
}

// ── InspectorPanel ────────────────────────────────────────────────────────────

function InspectorPanel({ selectedClip, clips, markers, selectedMarker, fps,
    onUpdateClip, onDeleteClip, onDuplicateClip,
    onUpdateMarker, onDeleteMarker, onAddClipAtMarker }) {

  const clip   = clips.find(c => c.id === selectedClip);
  const marker = markers.find(m => m.id === selectedMarker);

  if (clip) return (
    <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
      <div style={{ fontSize:10, fontWeight:700, color:"#555", textTransform:"uppercase", letterSpacing:1 }}>Clip Inspector</div>

      <div className="label-row">Name
        <input value={clip.name} onChange={e => onUpdateClip(clip.id, { name:e.target.value })} />
      </div>
      <div className="label-row">Track
        <select value={clip.track} onChange={e => onUpdateClip(clip.id, { track:e.target.value })}>
          {TRACK_DEFS.map(t => <option key={t.id} value={t.id}>{t.label}</option>)}
        </select>
      </div>
      <div className="label-row">Start time (s)
        <input type="number" step={+(1/fps).toFixed(4)} value={clip.startTime.toFixed(3)}
          onChange={e => onUpdateClip(clip.id, { startTime: Math.max(0, parseFloat(e.target.value)||0) })} />
      </div>
      <div className="label-row">Duration (s)
        <input type="number" step="0.1" min="0.1" value={clip.duration.toFixed(2)}
          onChange={e => onUpdateClip(clip.id, { duration: Math.max(0.1, parseFloat(e.target.value)||0.1) })} />
      </div>
      <div className="label-row">Volume
        <input type="range" min="0" max="1" step="0.01" value={clip.volume}
          onChange={e => onUpdateClip(clip.id, { volume: parseFloat(e.target.value) })} />
        <span style={{ fontSize:11, color:"#888" }}>{Math.round(clip.volume * 100)}%</span>
      </div>
      <div className="label-row">Fade In (s)
        <input type="number" step="0.05" min="0" value={clip.fadeIn.toFixed(2)}
          onChange={e => onUpdateClip(clip.id, { fadeIn: Math.max(0, parseFloat(e.target.value)||0) })} />
      </div>
      <div className="label-row">Fade Out (s)
        <input type="number" step="0.05" min="0" value={clip.fadeOut.toFixed(2)}
          onChange={e => onUpdateClip(clip.id, { fadeOut: Math.max(0, parseFloat(e.target.value)||0) })} />
      </div>

      <div style={{ display:"flex", gap:6, marginTop:4 }}>
        <button className="btn" style={{ flex:1, fontSize:11, justifyContent:"center" }} onClick={() => onDuplicateClip(clip.id)}>⧉ Duplicate</button>
        <button className="btn btn-red" style={{ flex:1, fontSize:11, justifyContent:"center" }} onClick={() => onDeleteClip(clip.id)}>🗑 Delete</button>
      </div>
    </div>
  );

  if (marker) return (
    <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
      <div style={{ fontSize:10, fontWeight:700, color:"#555", textTransform:"uppercase", letterSpacing:1 }}>Marker Inspector</div>
      <div className="label-row">Label
        <input value={marker.label} onChange={e => onUpdateMarker(marker.id, { label:e.target.value })} />
      </div>
      <div style={{ fontSize:11, color:"#666" }}>
        Time: <span style={{ color:"#ccc" }}>{marker.time.toFixed(3)}s</span><br/>
        Frame: <span style={{ color:"#a78bfa" }}>{marker.frame}</span>
      </div>
      <button className="btn btn-amber" style={{ fontSize:12, justifyContent:"center" }} onClick={() => onAddClipAtMarker(marker)}>
        🔊 Add Sound at Marker
      </button>
      <button className="btn btn-red" style={{ fontSize:12, justifyContent:"center" }} onClick={() => onDeleteMarker(marker.id)}>
        🗑 Delete Marker
      </button>
    </div>
  );

  return <div style={{ color:"#444", fontSize:12, lineHeight:1.7 }}>Select a clip or marker to edit its properties.</div>;
}

// ── App ───────────────────────────────────────────────────────────────────────

function App() {
  const videoRef  = useRef(null);
  const rafRef    = useRef(null);

  const [isPlaying,    setIsPlaying]    = useState(false);
  const [currentTime,  setCurrentTime]  = useState(0);
  const [duration,     setDuration]     = useState(10);
  const [fps,          setFps]          = useState(24);
  const [snapEnabled,  setSnapEnabled]  = useState(true);
  const [zoom,         setZoom]         = useState(80);
  const [projectTitle, setProjectTitle] = useState("Untitled Project");
  const [masterVol,    setMasterVol]    = useState(1);

  const [markers,       setMarkers]       = useState([]);
  const [clips,         setClips]         = useState([]);
  const [selectedClip,  setSelectedClip]  = useState(null);
  const [selectedMarker,setSelectedMarker]= useState(null);
  const [trackMuted,    setTrackMuted]    = useState({});
  const [trackSolo,     setTrackSolo]     = useState({});
  const [activeTab,     setActiveTab]     = useState("library");
  const [status,        setStatus]        = useState("");

  // RAF playhead sync
  useEffect(() => {
    if (isPlaying) {
      const tick = () => {
        if (videoRef.current) setCurrentTime(videoRef.current.currentTime);
        rafRef.current = requestAnimationFrame(tick);
      };
      rafRef.current = requestAnimationFrame(tick);
    } else {
      cancelAnimationFrame(rafRef.current);
    }
    return () => cancelAnimationFrame(rafRef.current);
  }, [isPlaying]);

  // Master vol
  useEffect(() => { engine.setMasterVol(masterVol); }, [masterVol]);

  function doPlay() {
    engine.init(); engine.resume();
    engine.scheduleTimeline(clips, currentTime, trackMuted, trackSolo);
    videoRef.current?.play();
    setIsPlaying(true);
  }
  function doPause() {
    videoRef.current?.pause();
    engine.stopAll();
    setIsPlaying(false);
  }
  function doRestart() {
    doPause();
    if (videoRef.current) videoRef.current.currentTime = 0;
    setCurrentTime(0);
  }
  function doSeek(t) {
    const ct = Math.max(0, Math.min(duration, t));
    if (videoRef.current) videoRef.current.currentTime = ct;
    setCurrentTime(ct);
    if (isPlaying) { engine.stopAll(); setTimeout(() => engine.scheduleTimeline(clips, ct, trackMuted, trackSolo), 50); }
  }

  // Keyboard shortcuts
  useEffect(() => {
    function onKey(e) {
      if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
      if (e.code === "Space")  { e.preventDefault(); isPlaying ? doPause() : doPlay(); }
      if (e.code === "KeyM")   { e.preventDefault(); addMarker(); }
      if (e.code === "Delete" || e.code === "Backspace") {
        if (selectedClip)   deleteClip(selectedClip);
        else if (selectedMarker) deleteMarker(selectedMarker);
      }
    }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [isPlaying, currentTime, fps, selectedClip, selectedMarker]);

  function addMarker() {
    const t  = snapEnabled ? snapToFrame(currentTime, fps) : currentTime;
    const fr = Math.round(t * fps);
    const m  = { id:genId(), time:t, frame:fr, label:`M${markers.length+1}` };
    setMarkers(prev => [...prev, m].sort((a,b) => a.time - b.time));
    setSelectedMarker(m.id);
    setSelectedClip(null);
    setStatus(`Marker added at ${t.toFixed(3)}s`);
  }

  function addClip(clip) {
    setClips(prev => [...prev, clip]);
    setSelectedClip(clip.id);
    setSelectedMarker(null);
  }

  function updateClip(id, patch)    { setClips(prev => prev.map(c => c.id===id ? {...c,...patch} : c)); }
  function deleteClip(id)           { setClips(prev => prev.filter(c => c.id!==id)); if (selectedClip===id) setSelectedClip(null); }
  function duplicateClip(id)        { const c = clips.find(c=>c.id===id); if(!c) return; const n={...c,id:genId(),startTime:c.startTime+c.duration+0.1}; setClips(prev=>[...prev,n]); setSelectedClip(n.id); }
  function moveClip(id, t)          { setClips(prev => prev.map(c => c.id===id ? {...c,startTime:Math.max(0,t)} : c)); }

  function updateMarker(id, patch)  { setMarkers(prev => prev.map(m => m.id===id ? {...m,...patch} : m)); }
  function deleteMarker(id)         { setMarkers(prev => prev.filter(m => m.id!==id)); if (selectedMarker===id) setSelectedMarker(null); }

  function addClipAtMarker(marker) {
    addClip({ id:genId(), name:SAMPLE_LIBRARY[2].name, soundId:SAMPLE_LIBRARY[2].id,
      startTime:marker.time, duration:SAMPLE_LIBRARY[2].duration,
      track:"sfx", volume:1, fadeIn:0, fadeOut:0, markerLink:marker.id });
  }

  function selectClip(id)   { setSelectedClip(id);   setSelectedMarker(null); }
  function selectMarker(id) { setSelectedMarker(id); setSelectedClip(null);   }

  function toggleMute(id) { setTrackMuted(p => ({...p,[id]:!p[id]})); }
  function toggleSolo(id) { setTrackSolo(p  => ({...p,[id]:!p[id]})); }

  // Save / Load / Export
  function saveProject() {
    const data = { title:projectTitle, fps, markers, clips, trackMuted, trackSolo, masterVol, duration };
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)], {type:"application/json"}));
    a.download = `${projectTitle.replace(/\s+/g,"-")}.json`;
    a.click();
    setStatus("Project saved ✓");
  }

  function loadProject() {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = ".json";
    inp.onchange = e => {
      const f = e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = ev => {
        try {
          const p = JSON.parse(ev.target.result);
          setProjectTitle(p.title || "Untitled");
          setFps(p.fps || 24);
          setMarkers(p.markers || []);
          setClips(p.clips || []);
          setTrackMuted(p.trackMuted || {});
          setTrackSolo(p.trackSolo || {});
          setMasterVol(p.masterVol ?? 1);
          setDuration(p.duration || 10);
          setStatus("Project loaded ✓");
        } catch(_) { setStatus("Error loading project"); }
      };
      r.readAsText(f);
    };
    inp.click();
  }

  async function exportWAV() {
    setStatus("Rendering…");
    try {
      engine.init();
      const wav  = await engine.exportWAV(clips, duration, masterVol, trackMuted, trackSolo);
      const a    = document.createElement("a");
      a.href     = URL.createObjectURL(new Blob([wav], {type:"audio/wav"}));
      a.download = `${projectTitle.replace(/\s+/g,"-")}_soundtrack.wav`;
      a.click();
      setStatus("WAV exported ✓");
    } catch(err) { setStatus("Export failed: " + err.message); }
  }

  return (
    <div style={{ display:"flex", flexDirection:"column", height:"100vh", overflow:"hidden" }}>

      {/* ── Top bar ── */}
      <div style={{
        display:"flex", alignItems:"center", gap:8, padding:"7px 12px",
        background:"#0d0d1e", borderBottom:"1px solid #1e1e3a", flexShrink:0, flexWrap:"wrap"
      }}>
        <a href="/" style={{ textDecoration:"none" }}>
          <span style={{ fontSize:14, fontWeight:700, color:"#7c3aed", whiteSpace:"nowrap" }}>🎬 Soundtrack Builder</span>
        </a>
        <input value={projectTitle} onChange={e => setProjectTitle(e.target.value)}
          style={{ width:160, padding:"4px 8px" }} placeholder="Project title" />
        <select value={fps} onChange={e => setFps(parseInt(e.target.value))} style={{ width:76 }}>
          {FPS_OPTIONS.map(f => <option key={f} value={f}>{f} fps</option>)}
        </select>
        <label style={{ display:"flex", alignItems:"center", gap:4, fontSize:12, color:"#666", cursor:"pointer", whiteSpace:"nowrap" }}>
          <input type="checkbox" checked={snapEnabled} onChange={e => setSnapEnabled(e.target.checked)} />
          Snap to frame
        </label>
        <div style={{ flex:1 }} />
        {status && <span style={{ fontSize:11, color:"#a78bfa", padding:"2px 8px", background:"#1a1030", borderRadius:4 }}>{status}</span>}
        <button className="btn" onClick={saveProject}>💾 Save</button>
        <button className="btn" onClick={loadProject}>📂 Load</button>
        <button className="btn btn-green" onClick={exportWAV}>📤 Export WAV</button>
      </div>

      {/* ── Main area ── */}
      <div style={{ display:"flex", flex:1, overflow:"hidden" }}>

        {/* Left sidebar */}
        <div style={{
          width:188, flexShrink:0, background:"#0b0b1a",
          borderRight:"1px solid #1e1e3a", padding:10,
          display:"flex", flexDirection:"column", gap:8, overflowY:"auto"
        }}>
          {/* Tab switcher */}
          <div style={{ display:"flex" }}>
            {["library","markers"].map((tab,i) => (
              <button key={tab} onClick={() => setActiveTab(tab)} style={{
                flex:1, padding:"5px 0", fontSize:11, cursor:"pointer",
                background: activeTab===tab ? "#1e1e3a" : "transparent",
                border:"1px solid #1e1e3a",
                borderRadius: i===0 ? "4px 0 0 4px" : "0 4px 4px 0",
                color: activeTab===tab ? "#a78bfa" : "#555",
                fontWeight:600, fontFamily:"inherit"
              }}>{tab==="library" ? "Library" : "Markers"}</button>
            ))}
          </div>

          {activeTab === "library"
            ? <AudioLibrary onAddClip={addClip} selectedMarker={selectedMarker} markers={markers} />
            : <>
                <button className="btn" style={{ justifyContent:"center", fontSize:12 }} onClick={addMarker}>
                  ◆ Add Marker (M)
                </button>
                <MarkerList markers={markers} selectedMarker={selectedMarker} onSelect={selectMarker} onDelete={deleteMarker} />
              </>
          }
        </div>

        {/* Center */}
        <div style={{ flex:1, display:"flex", flexDirection:"column", overflow:"hidden", minWidth:0 }}>

          {/* Video + transport */}
          <div style={{ padding:10, borderBottom:"1px solid #1e1e3a", flexShrink:0, background:"#0a0a18" }}>
            <VideoPreview videoRef={videoRef} onDuration={setDuration} />
            <TransportControls
              isPlaying={isPlaying} onPlay={doPlay} onPause={doPause} onRestart={doRestart}
              currentTime={currentTime} fps={fps} duration={duration}
            />
            {/* Zoom + Master vol */}
            <div style={{ display:"flex", alignItems:"center", gap:16, marginTop:6, flexWrap:"wrap" }}>
              <div style={{ display:"flex", alignItems:"center", gap:6, fontSize:12, color:"#555" }}>
                Timeline zoom:
                <button className="mini-btn" onClick={() => setZoom(z => Math.max(30,z-20))}>−</button>
                <span style={{ color:"#888", minWidth:44, textAlign:"center" }}>{zoom}px/s</span>
                <button className="mini-btn" onClick={() => setZoom(z => Math.min(400,z+20))}>+</button>
              </div>
              <div style={{ display:"flex", alignItems:"center", gap:6, fontSize:12, color:"#555" }}>
                Master vol:
                <input type="range" min="0" max="1" step="0.01" value={masterVol}
                  onChange={e => setMasterVol(parseFloat(e.target.value))} style={{ width:70 }} />
                <span style={{ color:"#888", minWidth:30 }}>{Math.round(masterVol*100)}%</span>
              </div>
              <button className="btn" style={{ fontSize:11 }} onClick={addMarker}>◆ Marker (M)</button>
            </div>
          </div>

          {/* Timeline */}
          <div style={{ flex:1, display:"flex", flexDirection:"column", overflow:"hidden" }}>
            <Timeline
              duration={duration} currentTime={currentTime} zoom={zoom}
              fps={fps} snapEnabled={snapEnabled}
              markers={markers} clips={clips}
              selectedClip={selectedClip} selectedMarker={selectedMarker}
              onSeek={doSeek} onSelectClip={selectClip} onSelectMarker={selectMarker}
              onClipMove={moveClip} trackMuted={trackMuted} trackSolo={trackSolo}
              onToggleMute={toggleMute} onToggleSolo={toggleSolo}
            />
          </div>
        </div>

        {/* Right sidebar */}
        <div style={{
          width:196, flexShrink:0, background:"#0b0b1a",
          borderLeft:"1px solid #1e1e3a", padding:10, overflowY:"auto"
        }}>
          <InspectorPanel
            selectedClip={selectedClip} clips={clips}
            markers={markers} selectedMarker={selectedMarker} fps={fps}
            onUpdateClip={updateClip} onDeleteClip={deleteClip} onDuplicateClip={duplicateClip}
            onUpdateMarker={updateMarker} onDeleteMarker={deleteMarker} onAddClipAtMarker={addClipAtMarker}
          />
        </div>

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
